extends: base.yaml
run_name: diabetes_regression
task: regression
data: {source: csv, path: data/diabetes.csv, target: target}
split: {test_size: 0.2, stratify: false}
preprocessing:
  - name: standard_scaler
models:
  - name: ridge
    params: {alpha: 1.0}
  - name: random_forest
    params: {n_estimators: 200, max_depth: 5}
selection: {metric: rmse, cv_folds: 5}
evaluation: {metrics: [r2, rmse, mae]}
